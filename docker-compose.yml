version: '3.8'

services:
  backend:
    build: .
    container_name: ecom_backend
    ports:
      - '5000:5000'
    env_file:
      - .env
    depends_on:
      - db
      - redis
    networks:
      - ecom_network

  db:
    image: postgres:15-alpine
    container_name: ecom_db
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: rootpassword
      POSTGRES_DB: ecommerce_db
    ports:
      - '5432:5432'
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - ecom_network

  redis:
    image: redis:alpine
    container_name: ecom_redis
    ports:
      - '6380:6379'
    networks:
      - ecom_network

volumes:
  db_data:

networks:
  ecom_network:
    driver: bridge
